name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Run automated tests
        run: python -m pytest -q

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "AI-5G-HandOver-Analytics" `
            --paths src `
            main.py

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/AI-5G-HandOver-Analytics/AI-5G-HandOver-Analytics.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not created: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AI-5G-HandOver-Analytics-Windows-x64
          path: dist/AI-5G-HandOver-Analytics/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
